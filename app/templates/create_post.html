{% extends "base.html" %}

{% block title %}Create a New Post - Plant-Swap{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>Create a New Post</h2>
    <form action="/create-post" method="POST" enctype="multipart/form-data">
        <!-- Plant Type -->
        <div class="mb-3">
            <label for="plantType" class="form-label">Plant Type</label>
            <input type="text" class="form-control" id="plantType" name="plantType" placeholder="e.g., Cactus, Succulent" required>
        </div>

        <!-- Description -->
        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" id="description" name="description" rows="4" placeholder="Add a description about the plant and swap details" required></textarea>
        </div>

        <!-- Location -->
        <div class="mb-3">
            <label for="location" class="form-label">Location</label>
            <input type="text" class="form-control" id="location" name="location" placeholder="e.g., Berlin, Germany" required>
        </div>

        <!-- Contact Information -->
        <div class="mb-3">
            <label for="contact" class="form-label">Contact Information</label>
            <input type="text" class="form-control" id="contact" name="contact" placeholder="e.g., john.doe@example.com or phone number" required>
        </div>

        <!-- Photo Upload -->
        <div class="mb-3">
            <label for="photo" class="form-label">Upload Photo (optional)</label>
            <input type="file" class="form-control" id="photo" name="photo" accept="image/*">
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary">Create Post</button>
    </form>
</div>
{% endblock %}
