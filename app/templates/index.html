{% extends "base.html" %}

{% block content %}

<div class="container mt-5"></div>

    <!-- Map and Filters -->
    <h2>{{ message }}</h2>

    <div class="col-md-8">
        <form method="GET" action="/">
            <input type="text" name="location" placeholder="Filter by location" class="form-control mb-3">
            <button type="submit" class="btn btn-primary">Filter</button>
        </form>
        <div id="map" style="width: 100%; height: 400px; border: 2px solid #ddd;"></div>
    </div>

    <!-- Right Column: User Posts -->
<div class="col-md-4">
    <h4>User Posts</h4>
    <div id="user-posts">
        {% for post in posts %}
        <div class="card mb-3">
            <div class="card-body">
                <h5 class="card-title">{{ post.plant_type }}</h5>
                <p class="card-text">{{ post.description }}</p>
                <p><strong>Contact:</strong> {{ post.contact_info }}</p>
                <p><strong>Location:</strong> {{ post.location_name }}</p>
                {% if post.photo %}
                <img src="{{ post.photo }}" alt="{{ post.plant_type }}" class="img-fluid">
                {% endif %}
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<!-- Inject map data and load the map script -->
<script>
    // Inject map data into the JavaScript context with Jinja syntax
    const mapData = {{ map_data | tojson | safe }};
</script>
<script src="{{ url_for('static', filename='js/map.js') }}" defer></script>

{% endblock %}
