{% extends "base.html" %}

{% block content %}
<div class="row">
    <!-- Map and Filters -->
    <h2>{{ message }}</h2>

    <div class="col-md-8">
        <div class="mb-3">
            <label for="areaFilter" class="form-label">Filter by Area:</label>
            <input type="text" id="areaFilter" class="form-control" placeholder="e.g., Mitte, Kreuzberg">
            <button class="btn btn-success mt-2" onclick="filterPins()">Apply Filter</button>
        </div>
        <div id="map" style="width: 100%; height: 400px; border: 2px solid #ddd;"></div>
    </div>

    <!-- Right Column: User Posts -->
    <div class="col-md-4">
        <h4>User Posts</h4>
        <div id="user-posts">
            <!-- Dynamically load posts here -->
        </div>
    </div>
</div>
{% endblock %}
